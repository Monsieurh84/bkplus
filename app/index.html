<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1E5282">
<title>BK+ · Application</title>
<link rel="icon" href="../icon-180.png">
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--steel:#1E5282;--indigo:#2239A9;--electric:#2B0AF1;--grad:linear-gradient(100deg,#1E5282,#2239A9 45%,#2B0AF1);--ink:#0E1630;--mute:#5E6680;--line:#E2E6EF;--bg:#F3F5FA;--soft:#EEF1FF;--ok:#0E9F6E;--err:#C62828;--warn:#B45309}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
h1,h2,h3{font-family:Sora,Manrope,sans-serif;letter-spacing:-.01em;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 16px;font-weight:800;text-decoration:none}
.btn-grad{background:var(--grad);color:#fff}.btn-line{background:#fff;border:2px solid var(--line);color:var(--ink)}.btn-ok{background:var(--ok);color:#fff}
.btn:disabled{opacity:.6;cursor:default}
/* Connexion */
.login{min-height:100%;display:grid;place-items:center;padding:20px;background:radial-gradient(700px 380px at 80% 0,rgba(43,10,241,.45),transparent 60%),#0B1433}
.login form{background:#fff;border-radius:24px;padding:30px;width:min(400px,100%);box-shadow:0 30px 60px rgba(0,0,0,.35)}
.login img{height:72px;margin-bottom:14px}
.login h1{font-size:24px;margin-bottom:4px}
.login p{color:var(--mute);margin:0 0 20px}
.login label{display:block;font-weight:800;font-size:14px;margin:12px 0 6px}
.login input{width:100%;border:2px solid var(--line);border-radius:12px;padding:13px 14px}
.login input:focus{outline:none;border-color:var(--indigo)}
.login .btn{width:100%;margin-top:18px;padding:15px}
.login .link{background:none;border:0;color:var(--indigo);font-weight:700;margin-top:12px;padding:0}
.msg{border-radius:12px;padding:11px 13px;font-weight:700;font-size:14px;margin-top:14px;display:none}.msg.on{display:block}
.msg.err{background:#FDECEC;color:var(--err)}.msg.ok{background:#E6F6EF;color:var(--ok)}
/* Application */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{background:#fff;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.brand img{height:46px}.brand b{font-family:Sora;display:block}.brand small{color:var(--mute);font-weight:700;font-size:12px}
.nav{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:10px;padding:11px 12px;font-weight:700;color:var(--mute);text-align:left;width:100%}
.nav.on{background:var(--soft);color:var(--indigo)}.nav:disabled{opacity:.45;cursor:default}
.nav .c{margin-left:auto;background:var(--electric);color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
.nav .c:empty{display:none}.nav small{margin-left:auto;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.who{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 0;font-size:13px;color:var(--mute)}
.who b{display:block;color:var(--ink)}.who button{border:0;background:none;color:var(--indigo);font-weight:700;padding:0;margin-top:6px}
.main{padding:22px 26px;min-width:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.head h1{font-size:24px;margin-right:auto}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--ok)}.live i{width:8px;height:8px;border-radius:50%;background:currentColor;animation:p 2s infinite}@keyframes p{50%{opacity:.3}}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px}.seg button{border:0;background:none;border-radius:7px;padding:7px 12px;font-weight:700;color:var(--mute)}.seg button.on{background:var(--ink);color:#fff}
.list{display:grid;gap:10px}
.d{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;text-align:left;width:100%}
.d:hover{border-color:#C9D0E2}.d.new{border-left:5px solid var(--electric)}
.d .th{width:72px;height:56px;border-radius:10px;background:var(--soft) center/cover;display:grid;place-items:center;font-weight:800;color:var(--indigo)}
.d h3{font-family:Manrope;font-size:16px;font-weight:800}.d p{margin:2px 0 0;color:var(--mute);font-size:13.5px}
.tag{display:inline-block;font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 9px;margin-left:6px;vertical-align:1px}
.t-urg{background:#FDECEC;color:var(--err)}.t-new{background:var(--soft);color:var(--indigo)}.t-aff{background:#FEF3C7;color:#92400E}.t-pla{background:#E6F6EF;color:var(--ok)}.t-arc{background:#EEF0F4;color:var(--mute)}
.empty{background:#fff;border:1px dashed #C9D0E2;border-radius:16px;padding:40px;text-align:center;color:var(--mute)}
/* Détail */
.scrim{position:fixed;inset:0;background:rgba(14,22,48,.4);opacity:0;pointer-events:none;transition:.2s;z-index:20}.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;z-index:21;transform:translateX(100%);transition:.25s;display:flex;flex-direction:column;visibility:hidden}
.panel.on{transform:none;visibility:visible}
.panel header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.panel header h2{font-size:19px}.panel .x{margin-left:auto;border:0;background:var(--bg);width:36px;height:36px;border-radius:10px;font-size:20px}
.panel .body{flex:1;overflow:auto;padding:18px 20px;display:grid;gap:14px;align-content:start}
.panel footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:14.5px;margin:0}.kv dt{color:var(--mute);font-weight:700}.kv dd{margin:0;font-weight:700}
.box{border:1px solid var(--line);border-radius:14px;padding:14px}.box h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ph a{display:block;text-decoration:none;color:var(--mute);font-size:12px;font-weight:700;line-height:1.25}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;background:var(--bg);margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;transition:.25s;background:var(--ink);color:#fff;font-weight:700;padding:12px 18px;border-radius:12px;z-index:30;max-width:calc(100% - 32px)}.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:860px){.app{grid-template-columns:1fr}.side{flex-direction:row;overflow:auto;padding:8px;gap:6px;border-right:0;border-bottom:1px solid var(--line)}.brand,.who{display:none}.nav{width:auto;white-space:nowrap}.main{padding:16px}.d{grid-template-columns:56px 1fr}.d .th{width:56px;height:46px}.d>.r{display:none}}
</style>
</head>
<body>
<div id="root"></div>
<div class="scrim" id="scrim"></div><aside class="panel" id="panel" aria-hidden="true"></aside><div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="../config.js?v=2"></script>
<script>
const C=window.BK_CONFIG, sb=supabase.createClient(C.url, C.key, {auth:{persistSession:true,autoRefreshToken:true}});
const $=s=>document.querySelector(s), root=$('#root');
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me=null, demandes=[], filtre='nouvelle', chan=null;
const STAT={nouvelle:['Nouvelle','t-new'],affaire:['En affaire','t-aff'],planifiee:['Planifiée','t-pla'],archivee:['Archivée','t-arc']};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),3000);}
const fdate=d=>new Date(d).toLocaleString('fr-FR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});

/* ---------- Connexion ---------- */
function loginView(msg){
  root.innerHTML=`<div class="login"><form id="lf" autocomplete="on"><img src="../logo-bk.png" alt="BK+"><h1>Connexion</h1><p>Application BK+ · accès réservé à l’équipe.</p>
  <label for="em">E-mail</label><input id="em" type="email" autocomplete="username" required>
  <label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="current-password" required>
  <button class="btn btn-grad" type="submit">Se connecter</button><button class="link" type="button" id="fg">Mot de passe oublié ?</button>
  <div class="msg ${msg?(msg[0]==='ok'?'ok':'err')+' on':''}" id="m">${msg?E(msg[1]):''}</div></form></div>`;
  $('#lf').onsubmit=async e=>{e.preventDefault(); const b=e.submitter; b.disabled=true;
    const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
    b.disabled=false; if(error){const m=$('#m');m.className='msg err on';m.textContent='E-mail ou mot de passe incorrect.';} };
  $('#fg').onclick=async()=>{const em=$('#em').value.trim(); const m=$('#m'); if(!em){m.className='msg err on';m.textContent='Indiquez d’abord votre e-mail.';return;}
    await sb.auth.resetPasswordForEmail(em,{redirectTo:location.href.split('#')[0]}); m.className='msg ok on'; m.textContent='Si ce compte existe, un e-mail de réinitialisation vient d’être envoyé.'; };
}
function newPasswordView(){
  root.innerHTML=`<div class="login"><form id="np"><img src="../logo-bk.png" alt="BK+"><h1>Nouveau mot de passe</h1><p>Choisissez un mot de passe d’au moins 10 caractères.</p>
  <label for="pw">Nouveau mot de passe</label><input id="pw" type="password" autocomplete="new-password" minlength="10" required>
  <button class="btn btn-grad" type="submit">Enregistrer</button><div class="msg" id="m"></div></form></div>`;
  $('#np').onsubmit=async e=>{e.preventDefault(); const {error}=await sb.auth.updateUser({password:$('#pw').value}); const m=$('#m');
    if(error){m.className='msg err on';m.textContent='Impossible : '+error.message;} else { history.replaceState(null,'',location.pathname); start(); } };
}

/* ---------- Application ---------- */
async function start(){
  const {data:{session}}=await sb.auth.getSession(); if(!session) return loginView();
  const {data:p}=await sb.from('profils').select('*').eq('id',session.user.id).maybeSingle();
  if(!p||p.role!=='bureau'||!p.actif){ root.innerHTML=`<div class="login"><form><img src="../logo-bk.png" alt=""><h1>Accès non activé</h1><p>Votre compte (${E(session.user.email)}) n’a pas encore d’accès bureau. Demandez au gérant de l’activer.</p><button class="btn btn-line" type="button" id="out">Se déconnecter</button></form></div>`; $('#out').onclick=()=>sb.auth.signOut(); return; }
  me=p; shell(); await load(); listen();
}
function shell(){
  root.innerHTML=`<div class="app"><aside class="side"><div class="brand"><img src="../logo-bk.png" alt=""><div><b>BK+</b><small>Application</small></div></div>
  <button class="nav on">📥 Demandes du site<span class="c" id="cn"></span></button>
  <button class="nav" disabled>🗓 Planning<small>bientôt</small></button><button class="nav" disabled>💼 Affaires<small>bientôt</small></button><button class="nav" disabled>🏗 Chantiers<small>bientôt</small></button><button class="nav" disabled>✅ À contrôler<small>bientôt</small></button>
  <div class="who"><b>${E(me.nom)}</b>Accès bureau<br><button id="out">Se déconnecter</button></div></aside><main class="main" id="main"></main></div>`;
  $('#out').onclick=()=>sb.auth.signOut();
}
async function load(){
  const {data,error}=await sb.from('demandes').select('*').order('created_at',{ascending:false}).limit(300);
  if(error){ toast('Erreur de chargement : '+error.message); return; }
  demandes=data; list();
}
function list(){
  $('#cn').textContent=demandes.filter(d=>d.statut==='nouvelle').length||'';
  const it=demandes.filter(d=>filtre==='toutes'||d.statut===filtre);
  $('#main').innerHTML=`<div class="head"><h1>Demandes du site</h1><span class="live"><i></i>En direct</span>
   <div class="seg">${[['nouvelle','Nouvelles'],['affaire','En affaire'],['planifiee','Planifiées'],['toutes','Toutes']].map(([k,l])=>`<button data-f="${k}" class="${filtre===k?'on':''}">${l}</button>`).join('')}</div></div>
   ${it.length?`<div class="list">${it.map(d=>`<button class="d ${d.statut==='nouvelle'?'new':''}" data-id="${d.id}"><span class="th" data-th="${E(d.photos[0]?.path||'')}">${d.photos.length?'':'—'}</span>
     <span><h3>${E(d.service)}${d.urgence==='urgent'?'<span class="tag t-urg">Urgent</span>':''}<span class="tag ${STAT[d.statut][1]}">${STAT[d.statut][0]}</span></h3><p>${E(d.nom)} · ${E(d.ville)} · ${d.photos.length} photo${d.photos.length>1?'s':''}</p></span>
     <span class="r" style="color:var(--mute);font-size:13px;font-weight:700">${fdate(d.created_at)}</span></button>`).join('')}</div>`:`<div class="empty">Aucune demande ${filtre==='nouvelle'?'nouvelle':'ici'} pour le moment.</div>`}`;
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filtre=b.dataset.f;list();});
  document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>detail(b.dataset.id));
  // vignettes (liens temporaires sécurisés)
  const paths=[...document.querySelectorAll('[data-th]')].map(e=>e.dataset.th).filter(Boolean);
  if(paths.length) sb.storage.from('demandes').createSignedUrls(paths,3600).then(({data})=>{ (data||[]).forEach(u=>{ const el=document.querySelector(`[data-th="${CSS.escape(u.path)}"]`); if(el&&u.signedUrl) el.style.backgroundImage=`url('${u.signedUrl}')`; }); });
}
async function detail(id){
  const d=demandes.find(x=>x.id===id); if(!d) return;
  const P=$('#panel');
  P.innerHTML=`<header><div><span class="tag ${STAT[d.statut][1]}" style="margin:0">${STAT[d.statut][0]}</span>${d.urgence==='urgent'?'<span class="tag t-urg">Urgent</span>':''}<h2 style="margin-top:8px">${E(d.service)}</h2><div style="color:var(--mute);font-size:13.5px">N° ${E(d.ref)} · ${fdate(d.created_at)}</div></div><button class="x" aria-label="Fermer">×</button></header>
  <div class="body">
    <dl class="kv"><dt>Client</dt><dd>${E(d.nom)} <span style="color:var(--mute);font-weight:600">· ${E(d.profil||'')}</span></dd><dt>Téléphone</dt><dd><a href="tel:${E(d.tel.replace(/\s/g,''))}">${E(d.tel)}</a></dd>${d.email?`<dt>E-mail</dt><dd><a href="mailto:${E(d.email)}">${E(d.email)}</a></dd>`:''}<dt>Adresse</dt><dd>${E([d.adresse,d.cp+' '+d.ville].filter(Boolean).join(', '))}</dd><dt>Délai</dt><dd>${{urgent:'Urgent',semaine:'Dans la semaine','pas-presse':'Pas pressé'}[d.urgence]||'—'}</dd></dl>
    <div class="box"><h4>Message</h4>${E(d.message)||'—'}</div>
    ${d.photos.length?`<div class="box"><h4>Photos (${d.photos.length})</h4><div class="ph" id="ph">${d.photos.map(p=>`<a target="_blank" rel="noopener" data-p="${E(p.path)}"><img alt="${E(p.label)}">${E(p.label)}</a>`).join('')}</div></div>`:''}
    ${d.manquantes.length?`<div class="box" style="border-color:#FDE68A;background:#FFFBEB"><h4>Photos impossibles à prendre</h4>${d.manquantes.map(E).join(' · ')}</div>`:''}
  </div>
  <footer>${d.statut!=='affaire'?`<button class="btn btn-grad" data-s="affaire">💼 Passer en affaire (devis)</button>`:''}${d.statut!=='planifiee'?`<button class="btn btn-ok" data-s="planifiee">🗓 Marquer planifiée</button>`:''}${d.statut!=='archivee'?`<button class="btn btn-line" data-s="archivee">Archiver</button>`:`<button class="btn btn-line" data-s="nouvelle">Remettre en nouvelle</button>`}</footer>`;
  P.classList.add('on'); P.setAttribute('aria-hidden','false'); $('#scrim').classList.add('on');
  P.querySelector('.x').onclick=close;
  P.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{ b.disabled=true; const s=b.dataset.s;
    const {error}=await sb.from('demandes').update({statut:s,traitee_par:me.id,traitee_le:new Date().toISOString()}).eq('id',d.id);
    if(error){ toast('Erreur : '+error.message); b.disabled=false; return; }
    d.statut=s; close(); list(); toast('Demande mise à jour'); });
  if(d.photos.length){ const {data}=await sb.storage.from('demandes').createSignedUrls(d.photos.map(p=>p.path),3600);
    (data||[]).forEach(u=>{ const a=P.querySelector(`[data-p="${CSS.escape(u.path)}"]`); if(a&&u.signedUrl){ a.href=u.signedUrl; a.querySelector('img').src=u.signedUrl; } }); }
}
function close(){ const P=$('#panel'); P.classList.remove('on'); P.setAttribute('aria-hidden','true'); $('#scrim').classList.remove('on'); }
$('#scrim').onclick=close; document.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });
function listen(){
  if(chan) sb.removeChannel(chan);
  chan=sb.channel('demandes').on('postgres_changes',{event:'*',schema:'public',table:'demandes'},p=>{
    if(p.eventType==='INSERT'){ demandes.unshift(p.new); toast('📥 Nouvelle demande : '+p.new.service+' · '+p.new.ville); try{ navigator.vibrate&&navigator.vibrate(150); }catch(e){} }
    else if(p.eventType==='UPDATE'){ const i=demandes.findIndex(x=>x.id===p.new.id); if(i>-1) demandes[i]=p.new; }
    list(); }).subscribe();
}

sb.auth.onAuthStateChange((ev)=>{ if(ev==='PASSWORD_RECOVERY') newPasswordView(); else if(ev==='SIGNED_IN') start(); else if(ev==='SIGNED_OUT'){ me=null; loginView(); } });
if(/type=recovery/.test(location.hash)) newPasswordView(); else start();
</script>
</body>
</html>
